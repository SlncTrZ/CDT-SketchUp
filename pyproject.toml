[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cdt-sketchup"
version = "0.1.1"
description = "Generic CAD execution engine for SketchUp over MCP"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Trương Công Định (SlncTrZ)" }]
keywords = ["sketchup", "cad", "mcp", "automation", "ai-agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
requires-python = ">=3.10"
dependencies = [
  "mcp==2.2.0",
  "uvicorn>=0.35,<1",
]

[project.urls]
Repository = "https://github.com/SlncTrZ/CDT-SketchUp"
Issues = "https://github.com/SlncTrZ/CDT-SketchUp/issues"

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "pytest-subtests>=0.15,<1", "ruff>=0.16,<1"]

[project.scripts]
cdt-sketchup = "cdt_sketchup.server:main"
cdt-sketchup-doctor = "cdt_sketchup.doctor:main"
cdt-sketchup-agent = "cdt_sketchup.agent_cli:main"
cdt-sketchup-runtime = "cdt_sketchup.runtime_admin:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = ["BLE001", "TRY004", "PLW1510", "UP036", "ASYNC221", "S110", "S112", "ISC004", "RUF059", "F841"]
