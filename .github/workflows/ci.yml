name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install . pytest
      - name: Test
        run: python -m pytest tests -q
      - name: Build reproducible RBZ
        run: python scripts/build_rbz.py --output dist/cdt-sketchup-bridge-0.1.0.rbz
      - name: Release provenance manifest
        run: >
          python scripts/release_manifest.py
          --output dist/release-manifest.json
          --evidence dist/cdt-sketchup-bridge-0.1.0.rbz
          --evidence scripts/native_bench_b4.py
          --evidence scripts/public_recovery_a05.py
          --require-clean
      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest-${{ matrix.os }}-${{ github.sha }}
          path: dist/release-manifest.json
